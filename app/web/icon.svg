<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Holiday Radio Matcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1b47"/>
      <stop offset="55%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#120a22"/>
    </linearGradient>
    <linearGradient id="pumpkin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffb03a"/>
      <stop offset="45%" stop-color="#ff7518"/>
      <stop offset="100%" stop-color="#e2560c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ff7518" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff7518" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- broadcast waves -->
  <g fill="none" stroke="#a855f7" stroke-linecap="round" opacity="0.85">
    <path d="M64 92a58 58 0 0 1 14-30" stroke-width="9" opacity="0.5"/>
    <path d="M40 84a86 86 0 0 1 20-44" stroke-width="9" opacity="0.28"/>
    <path d="M192 92a58 58 0 0 0-14-30" stroke-width="9" opacity="0.5"/>
    <path d="M216 84a86 86 0 0 0-20-44" stroke-width="9" opacity="0.28"/>
  </g>

  <ellipse cx="128" cy="160" rx="86" ry="70" fill="url(#glow)" filter="url(#soft)"/>

  <!-- stem -->
  <path d="M124 74c-2-14 3-24 12-28 3 8 1 13-3 18 7-2 13 0 16 5-8 1-14 5-16 12z" fill="#4ade80"/>

  <!-- pumpkin body -->
  <g fill="url(#pumpkin)">
    <ellipse cx="128" cy="158" rx="82" ry="68"/>
  </g>
  <g fill="#000" opacity="0.10">
    <ellipse cx="128" cy="158" rx="26" ry="68"/>
    <ellipse cx="128" cy="158" rx="56" ry="68"/>
  </g>

  <!-- carved face -->
  <g fill="#1b1030">
    <path d="M84 138l30-16 6 30-34-4z"/>
    <path d="M172 138l-30-16-6 30 34-4z"/>
    <path d="M114 106l-4 16 12-8z" opacity="0"/>
    <path d="M86 176h84c-4 20-20 32-42 32s-38-12-42-32z"/>
  </g>
  <g fill="url(#pumpkin)">
    <path d="M104 176l8 10 8-10zM136 176l8 10 8-10zM120 190h16l-8 10z" opacity="0.95"/>
  </g>

  <!-- inner light -->
  <g fill="#ffd166" opacity="0.55">
    <path d="M92 142l22-12 4 22-26-3z"/>
    <path d="M164 142l-22-12-4 22 26-3z"/>
  </g>
</svg>
