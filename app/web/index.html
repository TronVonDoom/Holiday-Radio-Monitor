<!doctype html>
<html lang="en" data-holiday="halloween" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Monitors holiday radio streams, identifies every song that airs, and turns them into playlists.">
<title>Holiday Radio Matcher</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script>
/* Theme and rail are applied before first paint. Reading them from the module
   would flash the wrong colours for as long as it takes to fetch, which on a
   cold load is long enough to see. */
(function () {
  var root = document.documentElement;
  try {
    var pref = localStorage.getItem("hrm-theme") || "system";
    root.dataset.themePref = pref;
    root.dataset.theme = pref === "system"
      ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : pref;
    if (localStorage.getItem("hrm-rail") === "1") root.dataset.rail = "1";
  } catch (e) { /* private mode; defaults are fine */ }
})();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/icon.svg" alt="" width="34" height="34">
      <div class="brand-name">
        <strong>Holiday Radio</strong>
        <span>Matcher</span>
      </div>
      <button class="icon-btn plain sm rail-toggle" data-act="rail"
              title="Collapse sidebar" aria-label="Collapse sidebar">
        <i class="ic" data-icon="panel"></i>
      </button>
    </div>

    <nav class="nav" id="nav" aria-label="Sections">
      <p class="nav-label">Monitor</p>
      <a class="nav-item" href="#/dashboard" data-view="dashboard">
        <i class="ic" data-icon="grid"></i><span class="label">Dashboard</span>
      </a>
      <a class="nav-item" href="#/review" data-view="review">
        <i class="ic" data-icon="check"></i><span class="label">Review</span>
        <span class="count" id="pill-review" data-zero="1">0</span>
      </a>

      <p class="nav-label">Catalogue</p>
      <a class="nav-item" href="#/library" data-view="library">
        <i class="ic" data-icon="disc"></i><span class="label">Library</span>
      </a>
      <a class="nav-item" href="#/playlists" data-view="playlists">
        <i class="ic" data-icon="list"></i><span class="label">Playlists</span>
      </a>

      <p class="nav-label">Configure</p>
      <a class="nav-item" href="#/stations" data-view="stations">
        <i class="ic" data-icon="radio"></i><span class="label">Stations</span>
      </a>
      <a class="nav-item" href="#/settings" data-view="settings">
        <i class="ic" data-icon="gear"></i><span class="label">Settings</span>
      </a>
    </nav>

    <div class="side-foot">
      <div class="worker" id="worker-state" title="Background worker">
        <span class="dot"></span><span class="label">Idle</span>
      </div>
      <div class="side-meta">
        <span id="app-version"></span>
        <button class="btn quiet sm" data-act="shortcuts" title="Keyboard shortcuts">
          <span class="kbd">?</span>
        </button>
      </div>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn nav-open" data-act="nav-open" aria-label="Open navigation"
              aria-controls="sidebar" aria-expanded="false">
        <i class="ic" data-icon="menu"></i>
      </button>

      <div class="topbar-title">
        <h1 id="view-title">Dashboard</h1>
        <p id="view-sub">Live monitoring across your holiday stations</p>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" data-act="theme" id="btn-theme"
                title="Theme" aria-label="Change theme">
          <i class="ic" data-icon="moon"></i>
        </button>
        <button class="icon-btn" data-act="refresh" id="btn-refresh"
                title="Refresh (r)" aria-label="Refresh">
          <i class="ic" data-icon="refresh"></i>
        </button>
        <span class="topbar-sep" aria-hidden="true"></span>
        <button class="btn primary" data-act="sync-all">
          <i class="ic" data-icon="upload"></i><span>Sync playlists</span>
        </button>
      </div>
    </header>

    <main class="main" id="main" tabindex="-1">
      <section class="view hidden" id="view-dashboard" aria-labelledby="view-title"></section>
      <section class="view hidden" id="view-review" aria-labelledby="view-title"></section>
      <section class="view hidden" id="view-library" aria-labelledby="view-title"></section>
      <section class="view hidden" id="view-playlists" aria-labelledby="view-title"></section>
      <section class="view hidden" id="view-stations" aria-labelledby="view-title"></section>
      <section class="view hidden" id="view-settings" aria-labelledby="view-title"></section>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" data-act="nav-close"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<dialog id="modal" class="modal"></dialog>

<script src="/app.js" type="module"></script>
</body>
</html>
