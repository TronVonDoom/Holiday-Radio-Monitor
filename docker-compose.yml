services:
  holiday-radio-matcher:
    build: .
    image: holiday-radio-matcher:latest
    container_name: holiday-radio-matcher
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Database, settings and the Spotify link. Back this up.
      - ./data/config:/config
      # Generated .m3u8 playlists. On UnRaid point this at a share.
      - ./data/playlists:/playlists
    environment:
      - TZ=America/New_York
      # Optional: set a value to require a token before the UI opens.
      # - HRM_AUTH_TOKEN=change-me
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=8).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
